name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: validate manifests + lint docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: pip install pyyaml

      - name: Validate JSON manifests + plugin source/agents shapes + frontmatter
        run: |
          python3 scripts/validate-manifests.py --selftest
          python3 scripts/validate-manifests.py

      - name: Validate plugin install structure + cross-links
        run: python3 scripts/check-install.py

      - name: Check docs JS parses
        run: |
          for f in docs/*.js; do node --check "$f"; done

      - name: Verify docs load under the /cjs-orchestrator/ subpath
        run: python3 scripts/check-docs-subpath.py

      - name: Scan docs for private-data leaks
        run: |
          python3 scripts/check-docs-leaks.py --selftest
          python3 scripts/check-docs-leaks.py

      - name: Self-test the scaffold validator
        run: python3 scripts/check-scaffold.py --selftest

      - name: Self-test the flywheel scripts
        run: |
          python3 plugins/develop/scripts/flywheel-aggregate.py --selftest
          python3 plugins/develop/scripts/flywheel-ingest.py --selftest
